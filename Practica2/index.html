<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Círculo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Calculadora de Círculo</h2>
        
        <div class="input-group">
            <label for="radio">Radio del círculo:</label>
            <input type="number" id="radio" placeholder="Ingresa el radio" step="any">
            <button onclick="calcularTodo()">Calcular</button>
        </div>

        <table border="1">
            <thead>
                <tr>
                    <th>Concepto</th>
                    <th>Resultado</th>
                    <th>Unidad</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Área</td>
                    <td id="area">---</td>
                    <td>unidades²</td>
                </tr>
                <tr>
                    <td>Circunferencia</td>
                    <td id="circunferencia">---</td>
                    <td>unidades</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
